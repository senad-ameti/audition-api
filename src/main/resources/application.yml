spring:
  application:
    name: audition-api
  config:
    import: "optional:configserver:"
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  mvc:
    throw-exception-if-no-handler-found: true
  cache:
    type: caffeine
server:
  max-http-request-header-size: 16KB
management:
  endpoints:
    web:
      exposure:
        include: '*'
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    com.audition.common.logging.RestTemplateLoggingInterceptor: INFO
    com.audition.configuration.ResponseHeaderInjector: DEBUG

audition:
  security:
    actuator-api-key: ${ACTUATOR_API_KEY:}
  logging:
    rest-template:
      enabled: false
  tracing:
    response-headers:
      enabled: true
      trace-id-header-name: X-Trace-Id
      span-id-header-name: X-Span-Id
  integration:
    posts-url: https://jsonplaceholder.typicode.com/posts
    posts-by-id-url: https://jsonplaceholder.typicode.com/posts/{id}
    post-comments-url: https://jsonplaceholder.typicode.com/posts/{postId}/comments
