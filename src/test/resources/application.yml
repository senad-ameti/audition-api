spring:
  application:
    name: audition-api
  config:
    import: "optional:configserver:"
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

logging:
  level:
    com.audition.common.logging.RestTemplateLoggingInterceptor: DEBUG

audition:
  logging:
    rest-template:
      enabled: true
  cache:
    enabled: false
  integration:
    posts-url: http://localhost:${wiremock.server.port}/posts
    posts-by-id-url: http://localhost:${wiremock.server.port}/posts/{id}
    post-comments-url: http://localhost:${wiremock.server.port}/posts/{postId}/comments
