management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: '*'

audition:
  security:
    actuator-api-key: test-api-key-12345
  tracing:
    response-headers:
      enabled: true
      trace-id-header-name: X-Test-Trace-Id
      span-id-header-name: X-Test-Span-Id

