plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id "maven-publish"
    id 'jacoco'
    id "com.github.spotbugs" version "5.0.14"
    id "io.freefair.lombok" version "8.14.1"
    id "checkstyle"
    id "pmd"
}

group = 'com.audition'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'
targetCompatibility = '17'

apply from: 'config/code-analysis.gradle'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2025.0.0")
    set('springdocVersion', "2.0.2")
    // removed: logbackVersion and slf4jVersion — versions now managed by Spring Boot BOM
}

dependencies {

    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springframework.cloud:spring-cloud-starter-config"
    implementation "org.springframework.boot:spring-boot-starter-validation" // added: required for @Valid, @NotBlank, @Size
    implementation "io.micrometer:micrometer-tracing-bridge-brave"

    // added: native Resilience4j Boot 3 support; replaces spring-cloud-starter-circuitbreaker-reactor-resilience4j
    // which pulled in Reactor/WebFlux — unnecessary for a servlet-stack application
    implementation("io.github.resilience4j:resilience4j-spring-boot3")

    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    // added: declares the Spring Cloud BOM inline; replaces the legacy dependencyManagement block
    implementation platform("org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}")

    developmentOnly "org.springframework.boot:spring-boot-devtools"

    runtimeOnly "io.micrometer:micrometer-registry-prometheus" // scope corrected: was implementation in original

    // added: replaces the explicit slf4j-api + logback-core + logback-classic pins;
    // Spring Boot manages logback versions via its BOM — pinning them separately risks version skew
    implementation 'org.springframework.boot:spring-boot-starter-logging'

    // added: provides LoggingEventCompositeJsonEncoder used in logback-spring.xml;
    // was referenced in the original logback config but missing from the classpath
    implementation "net.logstash.logback:logstash-logback-encoder:7.4"

    // removed: spring-boot-starter-data-jpa — no database in this service
    // removed: spring-boot-starter-webflux — servlet stack only; would conflict with MVC
    // removed: spring-boot-starter-aop — no custom aspects; Resilience4j manages its own proxies
    // removed: micrometer-tracing (standalone) — superseded by micrometer-tracing-bridge-brave
    // removed: io.micrometer:context-propagation — bundled inside micrometer-tracing-bridge-brave
    // removed: duplicate spring-cloud-starter-config declaration
    // removed: reactor-test — only needed for WebFlux reactive stream testing

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    // removed: reactor-test (see above)
}

// removed: dependencyManagement block — replaced by implementation platform(...) above,
// which is the Gradle-idiomatic BOM import for Boot 3+
//dependencyManagement {
//    imports {
//        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
//    }
//}


task prepareGitHooks(type: Copy) {
    from "$projectDir/git-hooks"
    into "$projectDir/.git/hooks"
    include "*"
}
tasks.matching { it.name != 'prepareGitHooks' }.all { Task task -> task.dependsOn prepareGitHooks }

// added: integration test source set wired up alongside unit tests
sourceSets {
    integrationTest {
        java {
            srcDir 'src/integrationTest/java'
        }
        resources {
            srcDir 'src/integrationTest/resources'
        }
        compileClasspath += sourceSets.main.output + sourceSets.test.output + configurations.testCompileClasspath
        runtimeClasspath += output + compileClasspath + configurations.testRuntimeClasspath
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    // added: WireMock for HTTP stubbing in integration tests; Jackson excluded to avoid
    // conflicts with the version already managed by Spring Boot
    integrationTestImplementation("org.wiremock:wiremock-standalone:3.9.1") {
        exclude group: "com.fasterxml.jackson.core"
        exclude group: "com.fasterxml.jackson.datatype"
        exclude group: "com.fasterxml.jackson.dataformat"
    }
}

tasks.named('processIntegrationTestResources') {
    duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.EXCLUDE // added: avoids duplicate resource errors
}

// added: registers the integrationTest task and runs it after unit tests
tasks.register('integrationTest', Test) {
    useJUnitPlatform()
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter test
}

tasks.named('test') {
    useJUnitPlatform()
}

// added: Checkstyle enforces Google Java style; 10.3.1 is the minimum version that supports
// LITERAL_SWITCH in WhitespaceAfterCheck
checkstyle {
    toolVersion = '10.3.1'
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
}
