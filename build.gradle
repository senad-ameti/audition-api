plugins {
    id 'java'
    id 'org.springframework.boot' version "${springBootVersion}"
    id 'io.spring.dependency-management' version "${dependencyManagementVersion}"
    id "maven-publish"
    id 'jacoco'
    id "com.github.spotbugs" version "${spotbugsVersion}"
    id "io.freefair.lombok" version "${lombokVersion}"
    id "checkstyle"
    id "pmd"
}

group = "${group}"
version = "${projectVersion}"
sourceCompatibility = javaVersion
targetCompatibility = javaVersion


apply from: 'config/code-analysis.gradle'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', springCloudVersion)
    set('logbackVersion', logbackVersion)
    set('slf4jVersion', slf4jVersion)
    set('wiremockVersion', wiremockVersion)
}

dependencies {

    /* Core Spring Boot Starters - Essential dependencies for the application */

    // Web framework for REST API endpoints
    implementation "org.springframework.boot:spring-boot-starter-web"

    // Health checks and metrics via /actuator endpoints
    implementation "org.springframework.boot:spring-boot-starter-actuator"

    // Bean validation (JSR-303) for request validation (@Valid, custom validators)
    implementation "org.springframework.boot:spring-boot-starter-validation"

    // Security framework for authentication and authorization
    implementation "org.springframework.boot:spring-boot-starter-security"

    // Caching abstraction with Caffeine as implementation
    implementation "org.springframework.boot:spring-boot-starter-cache"
    implementation "com.github.ben-manes.caffeine:caffeine"

    /* Configuration & Observability */

    // Spring Cloud Config client for externalized configuration
    implementation "org.springframework.cloud:spring-cloud-starter-config"

    // Prometheus metrics registry for monitoring (runtime only, not needed for compilation)
    runtimeOnly "io.micrometer:micrometer-registry-prometheus"

    /* Utilities */

    // Apache Commons Lang3 for utility methods (StringUtils, etc.)
    implementation "org.apache.commons:commons-lang3:${commonsLang3Version}"

    /* Logging - Note: SLF4J and Logback are already provided by spring-boot-starter-web,
       but explicit versions ensure consistency and allow custom logback configuration */
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    implementation "ch.qos.logback:logback-core:${logbackVersion}"
    implementation "ch.qos.logback:logback-classic:${logbackVersion}"

    /* Development Tools */

    // Hot reload and developer tools (only active during development)
    developmentOnly "org.springframework.boot:spring-boot-devtools"

    /* Test Dependencies */

    // Spring Boot testing framework with JUnit 5, Mockito, AssertJ
    testImplementation "org.springframework.boot:spring-boot-starter-test"

    // WireMock for mocking external HTTP services in component tests
    testImplementation "org.wiremock.integrations:wiremock-spring-boot:${wiremockVersion}"
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}


task prepareGitHooks(type: Copy) {
    from "$projectDir/git-hooks"
    into "$projectDir/.git/hooks"
    include "*"
}
tasks.matching { it.name != 'prepareGitHooks' }.all { Task task -> task.dependsOn prepareGitHooks }


tasks.named('test') {
    useJUnitPlatform()
}

checkstyle {
    toolVersion = checkstyleToolVersion
    configDirectory = file("${rootDir}/config/checkstyle")
}
