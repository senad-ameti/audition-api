tasks.withType(Checkstyle) {
    reports {
        xml.required = false
        html.required = true
        html.stylesheet = resources.text.fromFile('config/checkstyle/checkstyle-noframes-sorted.xsl')
    }
}

checkstyle {
    maxErrors = 0
    maxWarnings = 6
    ignoreFailures = false
    reportsDir = file("$project.buildDir/reports/checkstyle")
    showViolations = true
    toolVersion = "10.9.3"
    sourceSets = [sourceSets.main]
}

checkstyleMain.source = "src/main/java"

pmd {
    consoleOutput = true
    toolVersion = "7.0.0"
    rulesMinimumPriority = 5

    ignoreFailures = false
    ruleSetFiles = files("$rootProject.projectDir/config/pmd/ruleset.xml")
}

test {
    finalizedBy jacocoTestReport // report is always generated after tests run
}

jacocoTestReport {
    dependsOn test // tests are required to run before generating the report
}

jacoco {
    toolVersion = "0.8.8"
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.8
            }
        }

        rule {
            enabled = false
            element = 'CLASS'
            includes = ['org.gradle.*']

            limit {
                counter = 'LINE'
                value = 'TOTALCOUNT'
                maximum = 0.3
            }
        }
    }
}

spotbugs {
    ignoreFailures = false
    effort = 'max'
    reportLevel = 'high'

    // Add JVM args for Java 17+ compatibility
    jvmArgs = [
            '--add-opens', 'java.base/java.io=ALL-UNNAMED',
            '-Dspotbugs.source.level=17',
            '-Dspotbugs.target.level=17'
    ]
}

spotbugsMain {
    reports {
        html {
            required = true
            outputLocation = file("$buildDir/reports/spotbugs/spotbugs.html")
            stylesheet = 'fancy-hist.xsl'
        }
    }
}
